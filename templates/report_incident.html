{% extends "app.html" %}

{% block title %}Report incident · Sentinel{% endblock %}

{% block page %}
<div class="mb-8">
    <p class="text-xs font-medium uppercase tracking-wide text-blue-600">Report</p>
    <h1 class="mt-1 text-3xl font-semibold tracking-tight text-slate-800">Incident report</h1>
    <p class="mt-2 text-sm text-slate-500">Public and police can file an incident. Only police can later promote it to a criminal case.</p>
</div>

<article class="mx-auto max-w-xl rounded-2xl border border-blue-100 bg-white p-6 shadow-sm shadow-blue-100/50">
    <form action="{{ url_for('report_incident') }}" method="post" class="flex flex-col gap-4">
        <label class="flex flex-col gap-1.5 text-sm font-medium text-slate-700">
            Date
            <input type="date" name="Date" required min="1900-01-01" max="{{ today }}" onclick="this.showPicker && this.showPicker()" class="h-11 rounded-xl border border-slate-200 bg-slate-50 px-3.5 outline-none focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-100 [&::-webkit-calendar-picker-indicator]:h-5 [&::-webkit-calendar-picker-indicator]:w-5 [&::-webkit-calendar-picker-indicator]:cursor-pointer [&::-webkit-calendar-picker-indicator]:opacity-100">
        </label>
        <label class="flex flex-col gap-1.5 text-sm font-medium text-slate-700">
            Incident location
            <input type="text" name="incident_location" required placeholder="Area, road, or landmark" class="h-11 rounded-xl border border-slate-200 bg-slate-50 px-3.5 outline-none placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-100">
        </label>
        <label class="flex flex-col gap-1.5 text-sm font-medium text-slate-700">
            Accused name
            <input type="text" name="AccusedName" placeholder="If known" class="h-11 rounded-xl border border-slate-200 bg-slate-50 px-3.5 outline-none placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-100">
        </label>
        <label class="flex flex-col gap-1.5 text-sm font-medium text-slate-700">
            Description
            <textarea name="Description" rows="6" required placeholder="What happened" class="rounded-xl border border-slate-200 bg-slate-50 px-3.5 py-3 outline-none placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-100"></textarea>
        </label>
        <button type="submit" class="h-11 rounded-xl bg-blue-600 font-medium text-white shadow-lg shadow-blue-600/25 transition hover:bg-blue-700">File report</button>
    </form>
</article>
{% endblock %}
